# ~/.config/hypr/autostart.conf
# Personal autostart — overrides the default layer's autostart.conf
# The default layer uses uwsm-app and omarchy-specific daemons.
# This version uses direct exec-once calls which work without uwsm.

# ─── Notification daemon ─────────────────────────────────────────────────────
exec-once = mako

# ─── Status bar ──────────────────────────────────────────────────────────────
exec-once = waybar

# ─── Wallpaper ───────────────────────────────────────────────────────────────
# Option A: swaybg (what omarchy uses, simpler)
exec-once = swaybg -i ~/.config/omarchy/current/background -m fill

# Option B: hyprpaper (more Hyprland-native, supports per-monitor wallpapers)
# Requires: ~/.config/hypr/hyprpaper.conf  (set your wallpaper path there)
# exec-once = hyprpaper


# ─── App launcher ─────────────────────────────────────────────────────────────
exec-once = elephant
exec-once = walker --gapplication-service

# ─── Idle / screen lock ──────────────────────────────────────────────────────
# hypridle replaces omarchy-lock-screen / omarchy-launch-screensaver.
# Edit ~/.config/hypr/hypridle.conf for timeout tuning.
exec-once = hypridle

# ─── Clipboard history ───────────────────────────────────────────────────────
# cliphist stores clipboard history; SUPER+V can call it via wofi
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ─── Input method (remove if you don't use CJK / special input) ──────────────
# exec-once = fcitx5

# ─── Polkit agent (needed for sudo GUI prompts) ───────────────────────────────
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ─── Import environment vars for systemd / dbus ──────────────────────────────
# Ensures apps launched outside Hyprland can find Wayland socket etc.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all

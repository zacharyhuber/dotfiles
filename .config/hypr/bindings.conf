# ~/.config/hypr/bindings.conf
# Personal keybindings — overrides anything set in the omarchy defaults.
# This file replaces all omarchy-* command references with real equivalents.
# When you eventually run a full Omarchy install, this file will still work
# and will cleanly override the defaults the same way.

$mainMod = SUPER

# ─────────────────────────────────────────────────────────────────────────────
# APP VARIABLES
# Change these to match what you actually have installed.
# ─────────────────────────────────────────────────────────────────────────────
$terminal     = foot
$fileManager  = nautilus
$browser      = firefox
$editor       = foot -e nvim
$music        = foot -e ncmpcpp         # or: spotify, cmus, etc.
$messenger    = foot                    # replace with signal-desktop, telegram, etc.
$launcher     = walker        # replace with wofi --show drun  if errors with walker

# ─────────────────────────────────────────────────────────────────────────────
# APPLICATION LAUNCHES
# Mirrors omarchy's plain-bindings.conf but with real commands
# ─────────────────────────────────────────────────────────────────────────────

# Terminal — opens in home dir (omarchy-cmd-terminal-cwd needs the helper script)
bindd = $mainMod, RETURN, Terminal, exec, $terminal

# Terminal in current working directory (requires terminal-cwd script — see below)
# Once you have ~/.local/bin/terminal-cwd installed, uncomment this:
bindd = $mainMod SHIFT, RETURN, Terminal (cwd), exec, ~/.local/bin/terminal-cwd

# File manager
bindd = $mainMod SHIFT, F, File manager, exec, $fileManager --new-window

# File manager in current terminal cwd (uncomment once terminal-cwd script is installed)
bindd = $mainMod ALT SHIFT, F, File manager (cwd), exec, $fileManager --new-window "$(~/.local/bin/terminal-cwd --print-only)"

# Browser
bindd = $mainMod SHIFT, B, Browser, exec, $browser
bindd = $mainMod SHIFT ALT, B, Browser (private), exec, $browser --private-window

# Editor (neovim in terminal)
bindd = $mainMod SHIFT, N, Editor, exec, $editor

# Other apps from omarchy's bindings.conf
bindd = $mainMod, B, Web browser, exec, $browser
bindd = $mainMod, M, Music player, exec, $music
bindd = $mainMod, N, Neovim, exec, foot -e nvim
bindd = $mainMod, T, System monitor, exec, foot -e btop
bindd = $mainMod, G, Messenger, exec, $messenger
# bindd = $mainMod, D, Lazy Docker, exec, foot -e lazydocker   # uncomment if installed
# bindd = $mainMod, O, Obsidian, exec, obsidian -disable-gpu   # uncomment if installed
# bindd = $mainMod, SLASH, Password manager, exec, $browser    # set to 1password, bitwarden, etc.

# App launcher (replaces omarchy-menu for now)
bindd = $mainMod, SPACE, App launcher, exec, $launcher

# ─────────────────────────────────────────────────────────────────────────────
# WINDOW MANAGEMENT
# ─────────────────────────────────────────────────────────────────────────────
# bindd = $mainMod, C, Close window, killactive, # from Tiling-v2.conf: $mainMod, W, Close window, killactive, 
# bindd = $mainMod, V, Toggle floating, togglefloating, # from Tiling-v2.conf: $mainMod, T, Toggle window floating/tiling, togglefloating,
bindd = $mainMod, P, Pseudo tile, pseudo,
bindd = $mainMod, J, Toggle split, togglesplit,
bindd = $mainMod, F, Toggle fullscreen, fullscreen, 1

# Focus movement
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ─────────────────────────────────────────────────────────────────────────────
# WORKSPACES
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll workspaces with mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM
# ─────────────────────────────────────────────────────────────────────────────

# Lock screen (replaces omarchy-lock-screen)
bindd = $mainMod SHIFT, L, Lock screen, exec, hyprlock

# Exit Hyprland
bindd = $mainMod SHIFT, E, Exit Hyprland, exec, hyprctl dispatch exit

# Suspend
bindd = $mainMod SHIFT, X, Suspend, exec, systemctl suspend

# Screenshot — full screen to clipboard
bindd = ,       Print,         Screenshot (full), exec, grim - | wl-copy

# Screenshot — select area to clipboard  (requires grim + slurp)
bindd = SHIFT,  Print,         Screenshot (area), exec, grim -g "$(slurp)" - | wl-copy

# Screenshot — select area, save to file
bindd = $mainMod SHIFT, P, Screenshot (save), exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# ─────────────────────────────────────────────────────────────────────────────
# MEDIA / VOLUME / BRIGHTNESS
# These mirror omarchy's media.conf bindings with direct commands
# ─────────────────────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

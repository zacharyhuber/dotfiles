# ~/.config/hypr/hypridle.conf
# Replaces omarchy-lock-screen and omarchy-launch-screensaver with direct hyprlock calls.
# Omarchy's default hypridle.conf lives in the share layer — this user copy
# overrides those settings.

general {
    lock_cmd         = hyprlock                            # replaces omarchy-lock-screen
    before_sleep_cmd = loginctl lock-session               # lock before suspend
    after_sleep_cmd  = sleep 1 && hyprctl dispatch dpms on # wait for PAM, then wake display
    inhibit_sleep    = 3
}

listener {
    timeout    = 150                                       # 2.5 min — start screensaver
    on-timeout = pidof hyprlock || hyprlock               # replaces omarchy-launch-screensaver
}

listener {
    timeout    = 151                                       # just after above
    on-timeout = loginctl lock-session                    # lock session
}

listener {
    timeout    = 330                                       # 5.5 min — keyboard backlight off
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume  = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout    = 330                                       # 5.5 min — display off
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && brightnessctl -r
}

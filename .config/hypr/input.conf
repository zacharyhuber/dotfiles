# ~/.config/hypr/input.conf
# Overrides the omarchy default input settings.
# Tuned for MacBook 5,5 trackpad behaviour.

input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options = compose:caps   # Caps Lock → Compose key (omarchy default)
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll    = true    # macOS-style scroll direction
        tap-to-click      = true
        drag_lock         = false
        disable_while_typing = true
        scroll_factor     = 0.8     # slightly slower scroll on small trackpad
    }
}

misc {
    key_press_enables_dpms  = true
    mouse_move_enables_dpms = true
}

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
gesture = 3, horizontal, workspace

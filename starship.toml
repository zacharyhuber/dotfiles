format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

[character]
success_symbol = "[→](blue)"
error_symbol = "[→](red)"

[directory]
style = "cyan"
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
style = "magenta"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"


# ~/.config/hypr/monitors.conf
# MacBook 5,5 (2009, 13") — 1280x800 display, 1x pixel density (not retina)
# Overrides the omarchy default which sets GDK_SCALE=2 for retina displays.

# No GDK fractional scaling — 1280x800 at 1x is already low resolution
env = GDK_SCALE,1

# Auto-detect monitor, use native resolution, no scaling
monitor = , preferred, auto, 1

# If you ever connect an external display, add it explicitly below:
# monitor = HDMI-A-1, 1920x1080@60, auto, 1

# ~/.config/hypr/looknfeel.conf
# Overrides the omarchy default look-and-feel.
# Blur and heavy effects are dialled back for the MacBook 5,5's
# NVIDIA 9400M (nouveau driver) — these settings can be relaxed
# if performance feels fine in practice.

decoration {
    rounding = 2    # slight rounding; set to 0 to disable entirely

    blur {
        enabled  = true   # re-enable if GPU handles it fine
        size     = 2
        passes   = 1
    }

    shadow {
        enabled      = true
        range        = 2
        render_power = 2
        color        = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = linear,         0,    0,    1,    1

    # Slightly faster animations to feel snappier on older hardware
    animation = windows,       1, 3,   easeOutQuint
    animation = windowsIn,     1, 3,   easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.2, linear,       popin 87%
    animation = fade,          1, 2,   quick
    animation = workspaces,    0, 0,   ease          # disabled — instant workspace switch
    animation = layers,        1, 2,   easeOutQuint
}

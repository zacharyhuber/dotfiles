# Application bindings
bindd = SUPER, RETURN, Terminal, exec, foot
bindd = SUPER SHIFT, RETURN, Browser, exec, chromium
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, chromium
bindd = SUPER SHIFT ALT, B, Browser (private), exec, chromium --private
bindd = SUPER SHIFT, N, Editor, exec, nvim

# Add extra bindings
